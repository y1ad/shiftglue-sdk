name: Android SDK build (arm64)

# Cross-compiles the ReXGlue runtime and the FH1 Vulkan GPU plugin with the
# Android NDK. First goal: find every NDK/bionic incompatibility in one run
# (ninja -k 0 keeps going after the first error).

on:
  push:
    branches: [android-port]
    paths:
      - ".github/workflows/android-sdk.yml"
      - "src/**"
      - "include/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "thirdparty/CMakeLists.txt"
  workflow_dispatch:

concurrency:
  group: android-sdk-${{ github.ref }}
  cancel-in-progress: true

env:
  # memfd_create (guest memory mirrors) is only declared by bionic from API 30.
  ANDROID_API: "30"
  ANDROID_ABI: arm64-v8a

jobs:
  build:
    name: rexruntime + rexgpu-fh1 (android-arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Init required submodules (shallow)
        run: |
          git submodule update --init --depth 1 --jobs 8 -- \
            thirdparty/cli11 thirdparty/libmspack thirdparty/FFmpeg thirdparty/tomlplusplus \
            thirdparty/simde thirdparty/xxHash thirdparty/spdlog thirdparty/fmt thirdparty/utfcpp \
            thirdparty/imgui thirdparty/sdl3 thirdparty/vulkan-headers thirdparty/vulkan-memory-allocator \
            thirdparty/spirv-headers thirdparty/spirv-tools thirdparty/glslang thirdparty/o1heap \
            thirdparty/inja
          git submodule update --init --depth 1 --recursive -- thirdparty/libadrenotools

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-sdk-${{ env.ANDROID_ABI }}
          max-size: 1500M

      - name: Toolchain info
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version
          cmake --version
          ninja --version

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DREXGLUE_USE_VULKAN=ON \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_ENABLE_PERF_COUNTERS=OFF \
            -DREXGLUE_BUILD_TESTS=OFF 2>&1 | tee configure.log

      - name: Build rexruntime + rexgpu-fh1
        run: |
          set -o pipefail
          cmake --build build --target rexruntime rexgpu-fh1 -j"$(nproc)" -- -k 0 2>&1 | tee build.log

      - name: Error summary
        if: always()
        run: |
          {
            echo "### Configure errors"
            echo '```'
            grep -E "CMake Error" -A4 configure.log | head -60 || true
            echo '```'
            echo "### Build errors (first 80)"
            echo '```'
            grep -E " error: |FAILED:|undefined reference|ld.lld: error" build.log | sed -E 's#/home/runner/work/[^/]+/[^/]+/##' | sort -u | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          find build -name '*.so' | head -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-sdk-logs
          path: |
            configure.log
            build.log
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-arm64-libs
          path: |
            build/**/*.so
          if-no-files-found: warn
          retention-days: 7
